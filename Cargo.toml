[workspace]
members = [
    "amd_sp",
    "libasp"
]
resolver = "2"

[workspace.dependencies]
libafl = { git = "https://github.com/PSPReverse/LibAFL", rev = "b9029eb54f3c2218b8f921029e581de7fb54dd15",default-features = false, features = [
    "prelude",
    "fork"
] }
libafl_bolts = {  git = "https://github.com/PSPReverse/LibAFL", rev = "b9029eb54f3c2218b8f921029e581de7fb54dd15", features = ["errors_backtrace", "stable_anymap"]}
libafl_qemu = {  git = "https://github.com/PSPReverse/LibAFL", rev = "b9029eb54f3c2218b8f921029e581de7fb54dd15", features = [
    "arm",
    "systemmode",
], default-features = false }

libafl_targets = {  git = "https://github.com/PSPReverse/LibAFL", rev = "b9029eb54f3c2218b8f921029e581de7fb54dd15" }

[profile.dev]
debug = true
debug-assertions = true

[profile.release]
debug = true
debug-assertions = true