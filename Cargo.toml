[workspace]
members = [
    "amd_sp",
    "libasp"
]
resolver = "2"

[workspace.dependencies]
libafl = { git = "https://github.com/PSPReverse/LibAFL", rev = "7ed35f20146660b526af6e1dcbc4f74490495a0b",default-features = false, features = [
    "prelude",
    "fork"
] }
libafl_bolts = {  git = "https://github.com/PSPReverse/LibAFL", rev = "7ed35f20146660b526af6e1dcbc4f74490495a0b", features = ["errors_backtrace", "stable_anymap"]}
libafl_qemu = {  git = "https://github.com/PSPReverse/LibAFL", rev = "7ed35f20146660b526af6e1dcbc4f74490495a0b", features = [
    "arm",
    "systemmode",
], default-features = false }

libafl_targets = {  git = "https://github.com/PSPReverse/LibAFL", rev = "7ed35f20146660b526af6e1dcbc4f74490495a0b" }

[profile.dev]
debug = true
debug-assertions = true

[profile.release]
debug = true
debug-assertions = true