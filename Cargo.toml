[workspace]
members = [
    "amd_sp",
    "libasp"
]
resolver = "2"

[workspace.dependencies]
libafl = { git = "https://github.com/PSPReverse/LibAFL", rev = "9b23aa7c6cc62fdb3fb9c1d979cd49dfe110171d",default-features = false, features = [
    "prelude",
    "fork"
] }
libafl_bolts = {  git = "https://github.com/PSPReverse/LibAFL", rev = "9b23aa7c6cc62fdb3fb9c1d979cd49dfe110171d", features = ["errors_backtrace", "stable_anymap"]}
libafl_qemu = {  git = "https://github.com/PSPReverse/LibAFL", rev = "9b23aa7c6cc62fdb3fb9c1d979cd49dfe110171d", features = [
    "arm",
    "systemmode",
], default-features = false }

libafl_targets = {  git = "https://github.com/PSPReverse/LibAFL", rev = "9b23aa7c6cc62fdb3fb9c1d979cd49dfe110171d" }

[profile.dev]
debug = true
debug-assertions = true

[profile.release]
debug = true
debug-assertions = true