[workspace]
members = [
    "amd_sp",
    "libasp"
]
resolver = "2"

[workspace.dependencies]
libafl = { git = "https://github.com/PSPReverse/LibAFL", rev = "dbf497d529005cb1f3648625d64bbf40c90c5380",default-features = false, features = [
    "prelude",
    "fork"
] }
libafl_bolts = {  git = "https://github.com/PSPReverse/LibAFL", rev = "dbf497d529005cb1f3648625d64bbf40c90c5380", features = ["errors_backtrace", "stable_anymap"]}
libafl_qemu = {  git = "https://github.com/PSPReverse/LibAFL", rev = "dbf497d529005cb1f3648625d64bbf40c90c5380", features = [
    "arm",
    "systemmode",
], default-features = false }

libafl_targets = {  git = "https://github.com/PSPReverse/LibAFL", rev = "dbf497d529005cb1f3648625d64bbf40c90c5380" }

[profile.dev]
debug = true
debug-assertions = true

[profile.release]
debug = true
debug-assertions = true