[workspace]
members = [
    "amd_sp",
    "libasp"
]
resolver = "2"

[workspace.dependencies]
libafl = { git = "https://github.com/PSPReverse/LibAFL", rev = "8641c4f5c8b8aac18dde5f3af71a428a373ea549",default-features = false, features = [
    "prelude",
    "fork"
] }
libafl_bolts = {  git = "https://github.com/PSPReverse/LibAFL", rev = "8641c4f5c8b8aac18dde5f3af71a428a373ea549", features = ["errors_backtrace", "stable_anymap"]}
libafl_qemu = {  git = "https://github.com/PSPReverse/LibAFL", rev = "8641c4f5c8b8aac18dde5f3af71a428a373ea549", features = [
    "arm",
    "systemmode",
], default-features = false }

libafl_targets = {  git = "https://github.com/PSPReverse/LibAFL", rev = "8641c4f5c8b8aac18dde5f3af71a428a373ea549" }

[profile.dev]
debug = true
debug-assertions = true

[profile.release]
debug = true
debug-assertions = true